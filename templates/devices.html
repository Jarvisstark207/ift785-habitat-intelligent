<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Devices - Habitat Intelligent</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .devices-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-success { background: #43a047; color: white; }
        .btn-danger { background: #e53935; color: white; font-size: 12px; padding: 6px 12px; }
        .btn-warning { background: #fb8c00; color: white; font-size: 12px; padding: 6px 12px; }
        .btn-secondary { background: #8e24aa; color: white; }
        .btn-secondary:hover { background: #7b1fa2; }
        .devices-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .devices-table th { background: #667eea; color: white; padding: 14px 16px; text-align: left; font-weight: 600; }
        .devices-table td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
        .devices-table tr:last-child td { border-bottom: none; }
        .devices-table tr:hover td { background: #f9f9ff; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #e8f5e9; color: #2e7d32; }
        .badge-inactive { background: #ffebee; color: #c62828; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state h3 { margin-bottom: 8px; color: #666; }
        .actions-bar { display: flex; gap: 12px; margin-bottom: 24px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 22px; border-radius: 8px; color: white; font-weight: 600; z-index: 1000; display: none; }
        .toast-success { background: #43a047; }
        .toast-error { background: #e53935; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 500; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 480px; margin: 10% auto; }
        .modal-content h3 { margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Habitat Intelligent</h1>
        <p class="subtitle">Gestion des Devices</p>
    </header>

    <div class="devices-header">
        <h2 style="margin:0">Devices enregistrés (<span id="device-count">0</span>)</h2>
        <div style="display:flex; gap:10px">
            <a href="/devices/import" class="btn btn-secondary">Importer en lot</a>
            <a href="/devices/new" class="btn btn-primary">+ Nouveau device</a>
        </div>
    </div>

    <div id="devices-container">
        <div class="empty-state">
            <h3>Chargement...</h3>
        </div>
    </div>

    <div style="margin-top:16px">
        <a href="/" style="color:#667eea">← Retour au dashboard</a>
    </div>
</div>

<!-- Modal édition -->
<div class="modal" id="edit-modal">
    <div class="modal-content">
        <h3>Modifier le device</h3>
        <input type="hidden" id="edit-device-id">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="edit-name">
        </div>
        <div class="form-group">
            <label>Pièce</label>
            <input type="text" id="edit-room">
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="edit-type">
                <option value="light">Lumière</option>
                <option value="thermostat">Thermostat</option>
                <option value="sensor">Capteur</option>
                <option value="camera">Caméra</option>
                <option value="lock">Serrure</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fabricant</label>
            <input type="text" id="edit-manufacturer">
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger" onclick="closeModal()">Annuler</button>
            <button class="btn btn-success" onclick="saveEdit()">Enregistrer</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    async function loadDevices() {
        try {
            const resp = await fetch('/api/db/devices');
            const data = await resp.json();
            const devices = data.devices || [];
            document.getElementById('device-count').textContent = devices.length;
            const container = document.getElementById('devices-container');
            if (devices.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>Aucun device enregistré</h3><p>Créez votre premier device ou importez un lot.</p></div>';
                return;
            }
            let html = '<table class="devices-table"><thead><tr><th>ID</th><th>Nom</th><th>Pièce</th><th>Type</th><th>Fabricant</th><th>Statut</th><th>Actions</th></tr></thead><tbody>';
            for (const d of devices) {
                const status = d.status || 'active';
                const badgeClass = status === 'active' ? 'badge-active' : 'badge-inactive';
                html += `<tr>
                    <td><code style="font-size:12px">${d.device_id}</code></td>
                    <td><strong>${d.name}</strong></td>
                    <td>${d.room_name || '-'}</td>
                    <td>${d.device_type || '-'}</td>
                    <td>${d.manufacturer || '-'}</td>
                    <td><span class="badge ${badgeClass}">${status}</span></td>
                    <td>
                        <button class="btn btn-warning" onclick="openEdit('${d.device_id}','${d.name}','${d.room_name||''}','${d.device_type||''}','${d.manufacturer||''}')">Modifier</button>
                        <button class="btn btn-danger" onclick="deleteDevice('${d.device_id}')">Supprimer</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch(e) {
            document.getElementById('devices-container').innerHTML = '<div class="empty-state"><h3>Erreur de chargement</h3></div>';
        }
    }

    async function deleteDevice(id) {
        if (!confirm(`Supprimer le device "${id}" ?`)) return;
        const resp = await fetch(`/api/db/devices/${id}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.status === 'ok' || resp.ok) {
            showToast('Device supprimé', 'success');
            loadDevices();
        } else {
            showToast('Erreur suppression', 'error');
        }
    }

    function openEdit(id, name, room, type, manufacturer) {
        document.getElementById('edit-device-id').value = id;
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-room').value = room;
        document.getElementById('edit-type').value = type || 'light';
        document.getElementById('edit-manufacturer').value = manufacturer;
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveEdit() {
        const id = document.getElementById('edit-device-id').value;
        const payload = {
            name: document.getElementById('edit-name').value,
            room_name: document.getElementById('edit-room').value,
            device_type: document.getElementById('edit-type').value,
            manufacturer: document.getElementById('edit-manufacturer').value,
        };
        const resp = await fetch(`/api/db/devices/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (resp.ok) {
            showToast('Device modifié', 'success');
            closeModal();
            loadDevices();
        } else {
            showToast('Erreur modification', 'error');
        }
    }

    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type}`;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    loadDevices();
</script>
</body>
</html>
