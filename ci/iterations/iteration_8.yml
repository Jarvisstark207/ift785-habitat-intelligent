iteration: 8
name: "Patterns Communication Temps Reel"
description: "MQTT Pub-Sub, Event-Driven Architecture, WebSocket, Dashboard temps reel"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 6
      type: "import_test"
      target: "app"
    
    - name: "MQTT Broker connecte"
      points: 10
      type: "mqtt_check"
      broker: "localhost:1883"
    
    - name: "Dashboard temps reel"
      points: 12
      type: "endpoint_check"
      endpoints:
        - "/ws/dashboard"
        - "/api/realtime/status"
    
    - name: "Notifications push"
      points: 12
      type: "endpoint_check"
      endpoints:
        - "/api/notifications/subscribe"
        - "/api/notifications/history"

tests:
  weight: 30
  min_coverage: 82
  min_tests: 60
  test_structure:
    unit:
      min_tests: 32
      weight: 50
      required_files:
        - "tests/unit/test_mqtt_client.py"
        - "tests/unit/test_event_bus.py"
        - "tests/unit/test_websocket.py"
    
    integration:
      min_tests: 20
      weight: 35
      required_files:
        - "tests/integration/test_mqtt_broker.py"
        - "tests/integration/test_realtime_updates.py"
    
    api:
      min_tests: 8
      weight: 15
      required_files:
        - "tests/api/test_websocket_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 4
  max_complexity: 9
  code_duplication: false

git:
  weight: 10
  min_commits_per_person: 14
  min_contribution_ratio: 35
  conventional_commits_ratio: 80
