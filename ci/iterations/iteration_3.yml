iteration: 3
name: "Patterns de Conception"
description: "Introduction patterns GoF: Factory, Observer, Repository, Migrations"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 10
      type: "import_test"
      target: "app"
    
    - name: "Patterns implementes"
      points: 20
      type: "pattern_detection"
      patterns:
        - "Factory"
        - "Repository"
        - "Observer"
    
    - name: "API endpoints"
      points: 10
      type: "endpoint_check"
      endpoint: "/api/data"

tests:
  weight: 30
  min_coverage: 75
  min_tests: 10
  required_test_files:
    - "tests/test_factory.py"
    - "tests/test_repository.py"

quality:
  weight: 20
  max_flake8_errors: 5
  max_complexity: 10

git:
  weight: 10
  min_commits_per_person: 8
  min_contribution_ratio: 30
  conventional_commits_ratio: 70
