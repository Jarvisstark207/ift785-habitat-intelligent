iteration: 4
name: "Patterns Comportementaux"
description: "Observer, Strategy, State, Mediator - Scenarios automatises et profils utilisateurs"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 8
      type: "import_test"
      target: "app"
    
    - name: "Scenarios automatises"
      points: 12
      type: "endpoint_check"
      endpoints:
        - "/api/scenarios"
        - "/api/scenarios/{id}/execute"
        - "/api/scenarios/{id}/conditions"
    
    - name: "Profils utilisateurs"
      points: 12
      type: "endpoint_check"
      endpoints:
        - "/api/profiles"
        - "/api/profiles/{id}/activate"
    
    - name: "Pattern Observer detecte"
      points: 8
      type: "pattern_detection"
      patterns:
        - "Observer"
        - "Strategy"
        - "State"

tests:
  weight: 30
  min_coverage: 78
  min_tests: 45
  test_structure:
    unit:
      min_tests: 25
      weight: 60
      required_files:
        - "tests/unit/test_observer.py"
        - "tests/unit/test_strategy.py"
        - "tests/unit/test_state.py"
    
    integration:
      min_tests: 12
      weight: 25
      required_files:
        - "tests/integration/test_scenarios.py"
        - "tests/integration/test_profiles.py"
    
    api:
      min_tests: 8
      weight: 15
      required_files:
        - "tests/api/test_scenario_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 6
  max_complexity: 10
  code_duplication: false

git:
  weight: 10
  min_commits_per_person: 10
  min_contribution_ratio: 35
  conventional_commits_ratio: 75
