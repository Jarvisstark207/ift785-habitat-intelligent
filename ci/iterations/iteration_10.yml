iteration: 10
name: "Systèmes en Production — Résilience et Orchestration"
description: "Rendre le système production-ready : Circuit Breaker, Retry, Health Check, conteneurisation Docker Compose, reverse proxy Nginx, monitoring applicatif"

functionality:
  weight: 40
  checks:
    - name: "Application démarre"
      points: 4
      type: "import_test"
      target: "app"

    - name: "Patterns de résilience"
      points: 10
      type: "pattern_detection"
      patterns:
        - "CircuitBreaker"
        - "Retry"
        - "Timeout"
      description: "Circuit Breaker (états CLOSED/OPEN/HALF-OPEN), Retry avec backoff, Timeout configurable"

    - name: "Endpoints santé et métriques"
      points: 8
      type: "endpoint_check"
      endpoints:
        - "/api/health"
        - "/api/readiness"
        - "/api/metrics"
      description: "Health check complet (status services), readiness probe et métriques opérationnelles"

    - name: "Dockerfile valide"
      points: 6
      type: "dockerfile_check"
      checks:
        - "Dockerfile existe"
        - "Image de base officielle Python"
        - ".dockerignore présent"
        - "Image buildable sans erreur"

    - name: "docker-compose.yml complet"
      points: 8
      type: "compose_check"
      required_services:
        - name: "backend"
          must_build: true
        - name: "db"
          image_prefix: "postgres"
        - name: "nginx"
          image_prefix: "nginx"
      required_features:
        - "volumes nommés"
        - "depends_on avec condition"
        - "healthcheck par service"
        - "env_file ou environment"

    - name: "Stack démarre en une commande"
      points: 4
      type: "compose_up_check"
      command: "docker compose up --build -d"
      wait_seconds: 30
      health_endpoint: "/api/health"

tests:
  weight: 30
  min_coverage: 82
  min_tests: 62
  test_structure:
    unit:
      min_tests: 30
      weight: 42
      required_files:
        - "tests/unit/test_circuit_breaker.py"
        - "tests/unit/test_retry_timeout.py"
        - "tests/unit/test_health_check.py"
        - "tests/unit/test_config.py"

    integration:
      min_tests: 22
      weight: 40
      required_files:
        - "tests/integration/test_circuit_breaker_states.py"
        - "tests/integration/test_postgres_repository.py"
        - "tests/integration/test_compose_services.py"

    api:
      min_tests: 10
      weight: 18
      required_files:
        - "tests/api/test_health_endpoints.py"
        - "tests/api/test_full_stack.py"

quality:
  weight: 20
  max_flake8_errors: 3
  max_complexity: 8
  code_duplication: false
  required_files_quality:
    - "Dockerfile"
    - "docker-compose.yml"
    - ".env.example"

git:
  weight: 10
  min_commits_per_person: 15
  min_contribution_ratio: 35
  conventional_commits_ratio: 85

bonus:
  max_points: 10
  cap_total: 100
  description: "Interface graphique optionnelle — compense les pertes sur les critères principaux"
  checks:
    - name: "Dashboard monitoring et statut Circuit Breaker"
      points: 5
      type: "frontend_check"
      description: "Tableau de bord des services (vert/orange/rouge selon état circuit breaker) avec métriques de latence"
      urls:
        - "/monitoring"
        - "/monitoring/services"
    - name: "Page configuration et observabilité"
      points: 5
      type: "frontend_check"
      description: "Visualisation des conteneurs actifs, logs agrégés et statut de chaque service Docker"
      urls:
        - "/admin/infra"
