iteration: 1
name: "POO Basique - Refactoring"
description: "Transformation du code procedural en POO avec principes SOLID"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 15
      type: "import_test"
      target: "app"
    
    - name: "Classes POO presentes"
      points: 15
      type: "class_detection"
      min_classes: 5
      expected_classes:
        - "Device"
        - "Room"
        - "Sensor"
        - "Database"
    
    - name: "API /api/data fonctionne"
      points: 10
      type: "endpoint_check"
      endpoint: "/api/data"

tests:
  weight: 30
  min_coverage: 70
  min_tests: 5
  required_test_files:
    - "tests/test_device.py"
    - "tests/test_room.py"

quality:
  weight: 20
  max_flake8_errors: 10
  max_complexity: 10

git:
  weight: 10
  min_commits_per_person: 5
  min_contribution_ratio: 30
  conventional_commits_ratio: 60
