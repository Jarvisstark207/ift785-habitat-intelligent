iteration: 7
name: "Dependency Injection + Repository - Partie 2"
description: "Multi-utilisateurs, permissions, isolation donnees, Service Locator"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 8
      type: "import_test"
      target: "app"
    
    - name: "Authentification utilisateurs"
      points: 14
      type: "endpoint_check"
      endpoints:
        - "/api/auth/login"
        - "/api/auth/register"
        - "/api/auth/me"
    
    - name: "Permissions et isolation"
      points: 10
      type: "endpoint_check"
      endpoints:
        - "/api/users/{id}/devices"
        - "/api/users/{id}/permissions"
    
    - name: "Service Locator pattern"
      points: 8
      type: "pattern_detection"
      patterns:
        - "ServiceLocator"

tests:
  weight: 30
  min_coverage: 82
  min_tests: 58
  test_structure:
    unit:
      min_tests: 32
      weight: 55
      required_files:
        - "tests/unit/test_auth.py"
        - "tests/unit/test_permissions.py"
        - "tests/unit/test_service_locator.py"
    
    integration:
      min_tests: 18
      weight: 30
      required_files:
        - "tests/integration/test_multi_users.py"
        - "tests/integration/test_data_isolation.py"
    
    api:
      min_tests: 8
      weight: 15
      required_files:
        - "tests/api/test_auth_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 4
  max_complexity: 9
  code_duplication: false

git:
  weight: 10
  min_commits_per_person: 12
  min_contribution_ratio: 35
  conventional_commits_ratio: 80
