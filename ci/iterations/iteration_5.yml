iteration: 5
name: "Patterns Structurels"
description: "Facade, Proxy, Adapter, Decorator - Integration APIs tierces et dashboard unifie"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 8
      type: "import_test"
      target: "app"
    
    - name: "Integration APIs tierces"
      points: 14
      type: "endpoint_check"
      endpoints:
        - "/api/integrations/philips-hue"
        - "/api/integrations/nest"
        - "/api/integrations/generic"
    
    - name: "Dashboard unifie"
      points: 10
      type: "endpoint_check"
      endpoints:
        - "/api/dashboard/summary"
        - "/api/dashboard/widgets"
    
    - name: "Patterns structurels"
      points: 8
      type: "pattern_detection"
      patterns:
        - "Adapter"
        - "Facade"
        - "Proxy"
        - "Decorator"

tests:
  weight: 30
  min_coverage: 80
  min_tests: 50
  test_structure:
    unit:
      min_tests: 28
      weight: 55
      required_files:
        - "tests/unit/test_adapter.py"
        - "tests/unit/test_facade.py"
        - "tests/unit/test_proxy.py"
        - "tests/unit/test_decorator.py"
    
    integration:
      min_tests: 14
      weight: 30
      required_files:
        - "tests/integration/test_api_integrations.py"
        - "tests/integration/test_cache_proxy.py"
    
    api:
      min_tests: 8
      weight: 15
      required_files:
        - "tests/api/test_integration_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 5
  max_complexity: 9
  code_duplication: false

git:
  weight: 10
  min_commits_per_person: 12
  min_contribution_ratio: 35
  conventional_commits_ratio: 75
