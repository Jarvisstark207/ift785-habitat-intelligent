iteration: 9
name: "Programmation par Aspect (AOP) — Séparation des préoccupations"
description: "AOP en Python via décorateurs composables : aspects de logging, cache, retry, audit sécurité, et Event Bus par abonnement déclaratif"

functionality:
  weight: 40
  checks:
    - name: "Application démarre"
      points: 5
      type: "import_test"
      target: "app"

    - name: "Aspects transversaux composables"
      points: 10
      type: "pattern_detection"
      patterns:
        - "@aspect_log"
        - "@aspect_cache"
        - "@aspect_retry"
        - "@aspect_audit"
      description: "Quatre aspects indépendants, empilables sur n'importe quelle fonction métier"

    - name: "Aspect cache fonctionnel"
      points: 8
      type: "endpoint_check"
      endpoints:
        - "/api/sensors/latest"
        - "/api/devices/summary"
      description: "Endpoints annotés @aspect_cache(ttl=X) : second appel retourne résultat en cache"

    - name: "Event Bus déclaratif"
      points: 10
      type: "pattern_detection"
      patterns:
        - "@on_event"
        - "EventBus"
        - "publish"
        - "subscribe"
      description: "Bus d'événements avec abonnement déclaratif (@on_event('device.updated')) et publication explicite"

    - name: "Aspect retry sur API externe"
      points: 7
      type: "pattern_detection"
      patterns:
        - "@aspect_retry"
        - "backoff"
        - "max_attempts"
      description: "Retry avec backoff exponentiel sur les appels à des services externes (simulation Philips Hue, météo)"

tests:
  weight: 30
  min_coverage: 83
  min_tests: 63
  test_structure:
    unit:
      min_tests: 36
      weight: 52
      required_files:
        - "tests/unit/test_aspect_log.py"
        - "tests/unit/test_aspect_cache.py"
        - "tests/unit/test_aspect_retry.py"
        - "tests/unit/test_aspect_audit.py"
        - "tests/unit/test_event_bus.py"

    integration:
      min_tests: 20
      weight: 33
      required_files:
        - "tests/integration/test_event_bus_flow.py"
        - "tests/integration/test_cache_invalidation.py"

    api:
      min_tests: 7
      weight: 15
      required_files:
        - "tests/api/test_cached_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 3
  max_complexity: 8
  code_duplication: false
  description: "Les aspects doivent être réutilisables sans modification — aucun couplage avec le code métier"

git:
  weight: 10
  min_commits_per_person: 14
  min_contribution_ratio: 35
  conventional_commits_ratio: 82

bonus:
  max_points: 10
  cap_total: 100
  description: "Interface graphique optionnelle — compense les pertes sur les critères principaux"
  checks:
    - name: "Dashboard événements en temps réel"
      points: 5
      type: "frontend_check"
      description: "Flux live des événements publiés sur l'EventBus (device.updated, sensor.alert…) affiché en temps réel"
      urls:
        - "/events/live"
    - name: "Visualisation du cache"
      points: 5
      type: "frontend_check"
      description: "Interface indiquant les clés en cache, leur TTL restant et le taux de cache-hit par endpoint"
      urls:
        - "/admin/cache"
