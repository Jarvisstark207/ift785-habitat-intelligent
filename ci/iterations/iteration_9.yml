iteration: 9
name: "Patterns Resilience Distribuee"
description: "Circuit Breaker, Retry, Timeout, Bulkhead, Health Check - Systeme distribue tolerant aux pannes"

functionality:
  weight: 40
  checks:
    - name: "Application demarre"
      points: 6
      type: "import_test"
      target: "app"
    
    - name: "Multi-capteurs distribues"
      points: 12
      type: "endpoint_check"
      endpoints:
        - "/api/sensors/distributed"
        - "/api/sensors/{id}/health"
    
    - name: "Resilience patterns"
      points: 14
      type: "pattern_detection"
      patterns:
        - "CircuitBreaker"
        - "Retry"
        - "HealthCheck"
    
    - name: "Tolerance pannes"
      points: 8
      type: "endpoint_check"
      endpoints:
        - "/api/health"
        - "/api/status/services"

tests:
  weight: 30
  min_coverage: 83
  min_tests: 65
  test_structure:
    unit:
      min_tests: 35
      weight: 50
      required_files:
        - "tests/unit/test_circuit_breaker.py"
        - "tests/unit/test_retry.py"
        - "tests/unit/test_health_check.py"
    
    integration:
      min_tests: 22
      weight: 35
      required_files:
        - "tests/integration/test_distributed_sensors.py"
        - "tests/integration/test_fault_tolerance.py"
    
    api:
      min_tests: 8
      weight: 15
      required_files:
        - "tests/api/test_health_endpoints.py"

quality:
  weight: 20
  max_flake8_errors: 3
  max_complexity: 8
  code_duplication: false

git:
  weight: 10
  min_commits_per_person: 14
  min_contribution_ratio: 35
  conventional_commits_ratio: 82
